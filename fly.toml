# Onset office on Fly.io. Deliberately no [http_service]: the machine gets no
# public IP. Traffic arrives only through the Cloudflare Tunnel, which sits
# behind Cloudflare Access (login) at https://office.onsetworkouts.com.
app = "onset-office-sm"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  SERVE_STATIC = "1"
  LOCALHOST_ONLY = "1"
  DATABASE_URL = "sqlite+aiosqlite:////data/visualizer.db"
  SUMMARY_BACKEND = "disabled"
  SUMMARY_ENABLED = "false"
  LOG_RICH_TRACEBACKS = "0"
  PUBLIC_ORIGINS = '["https://office.onsetworkouts.com"]'
  # One office per company: "id:Title = agent:Name:emoji, ..." (max 7 staff).
  # The boss is the office id. Each office needs a secret:
  #   fly secrets set OFFICE_KEY_<ID>=$(openssl rand -hex 24)
  # Edit, then `fly deploy`.
  OFFICES = """
onset:Onset = social:Social:📸, email:Email:✉️, ads:Ads:📣, analyst:Analyst:📊, creators:Creators:🤝;
grace:Grace & Ashes = store:Store:🛍️, ads:Ads:📣, social:Social:📸, support:Support:🎧;
blackout:Blackout Cards = social:Social:📸, store:Store:🛍️, app:App:📱, email:Email:✉️;
utterly:UtterlyCovered = seo:SEO:🔍, content:Content:✍️, analyst:Analyst:📊;
hostmate:Hostmate = sales:Sales:🤝, support:Support:🎧, content:Content:✍️, analyst:Analyst:📊;
"""

[mounts]
  source = "office_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
